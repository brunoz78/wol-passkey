<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Wake on LAN Passkey">
  <title>WoL Passkey</title>
  <defs>
    <linearGradient id="wolBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#wolBadge)"/>

  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <!-- Broadcast-Wellen: das Magic Packet -->
    <path d="M 380.8 242.3 A 148 148 0 0 0 285.7 147.2" stroke-width="24" opacity="0.9"/>
    <path d="M 422.6 228.7 A 192 192 0 0 0 299.3 105.4" stroke-width="24" opacity="0.55"/>

    <!-- Power-Symbol: das geweckte Geraet -->
    <path d="M 292.8 212.6 A 92 92 0 1 1 187.2 212.6" stroke-width="40"/>
    <path d="M 240 160 L 240 282" stroke-width="40"/>
  </g>
</svg>
